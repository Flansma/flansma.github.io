title: "Seungeon Lee"
tagline: "AI Drug Discovery Researcher"
description: "Seungeon Lee's portfolio site — AI-driven medium-sized peptide drug discovery"
timezone: Asia/Tokyo
url: "https://flansma.github.io"
baseurl: ""
permalink: pretty
lang: en

# --- jekyll-seo-tag inputs ---
# Social links are sourced from _data/profile.yml (single source of truth).
# Custom Person JSON-LD on the homepage emits the rich sameAs list.
author:
  name: "Seungeon Lee"
  twitter: flansma
  email: lee.seungeon.62y@st.kyoto-u.ac.jp
twitter:
  username: flansma
  card: summary_large_image
logo: /assets/img/face.jpg

# --- Plugins (all preinstalled on GitHub Pages) ---
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Default layouts per scope — auto-applies layout based on collection type.
# This means new content files don't need a `layout:` line in their front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      # No site-wide `image:`. A page that has its own picture sets `image:` and gets
      # it as its og:image; a page that has none emits no og:image at all, rather than
      # inheriting one talk's photo as the card for every publication and preprint.
      # This also removes a whole class of bug: an injected default made
      # `{% if page.image %}` always true, so the share card leaked into pages as if
      # it were content imagery.
      # jekyll-seo-tag resolves the page author as page.author -> page.authors.first
      # -> site.author. Without this default it reached authors.first, so the one
      # paper where the site owner is NOT first author was attributed site-wide
      # (meta author, og, and seo-tag's JSON-LD) to a co-author. Pin it.
      author: Seungeon Lee
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: preprints
    values:
      layout: preprint

# Prevent macOS metadata from being processed
exclude:
  - .DS_Store
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _templates
  - _reference
  # Figure source artwork. jekyll-sitemap indexes static files by extension
  # allowlist (.pdf among them), so this 883 KB editable source was being
  # advertised for indexing as if it were a document. Only the .png is published.
  - assets/img/publications/helm-bert-architecture.pdf

# Collections for itemized content
collections:
  publications:
    output: true
    sort_by: date
    order: descending
    permalink: /publications/:name/
  preprints:
    output: true
    sort_by: date
    order: descending
    permalink: /preprints/:name/
  talks:
    output: true
    sort_by: date
    order: descending
    permalink: /talks/:name/
  awards:
    output: false
    sort_by: date
    order: descending
  writings:
    output: false
    sort_by: date
    order: descending

markdown: kramdown
theme: null
